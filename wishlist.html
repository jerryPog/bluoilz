<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Your Wishlist | Bluoilz</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo" aria-label="Bluoilz Home">
        <span class="brand-name">Bluoilz</span>
        <span class="brand-tag">Therapeutic Ancient Alchemy</span>
      </a>

      <nav class="desktop-nav" aria-label="Main Navigation">
        <ul class="nav-links">
          <li class="nav-item"><a href="index.html" class="nav-link" title="Home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> <span class="nav-text">Home</span></a></li>
          <li class="nav-item"><a href="wishlist.html" class="nav-link active" title="Wishlist"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> <span class="nav-text">Wishlist</span></a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <button class="header-action-btn open-cart-btn desktop-only-action" title="View Cart" aria-label="View Cart">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
          <span class="cart-badge" style="display:none;">0</span>
        </button>
      </div>
    </div>

    <!-- Mobile Top Quick Navigation Bar (Home, Shop, Search, Cart) -->
    <nav class="mobile-top-nav" id="mobileTopNav" aria-label="Mobile Navigation">
      <div class="mobile-top-nav-inner">
        <a href="index.html" class="top-nav-item" aria-label="Home">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span>Home</span>
        </a>
        <a href="index.html#products" class="top-nav-item" aria-label="Shop">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span>Shop</span>
        </a>
        <a href="index.html" class="top-nav-item" aria-label="Search">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span>Search</span>
        </a>
        <button type="button" class="top-nav-item open-cart-btn" aria-label="Cart">
          <div class="top-nav-icon-wrap">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <span class="cart-badge top-nav-badge" style="display:none;">0</span>
          </div>
          <span>Cart</span>
        </button>
      </div>
    </nav>
  </header>

  <main style="padding: 60px 0; min-height: 60vh;">
    <div class="container">
      <div class="section-header" style="text-align: center; margin-bottom: 40px;">
        <span class="section-eyebrow">Your Personal Collection</span>
        <h1 class="section-title" style="font-size: 2.5rem; margin-top: 10px;">Therapeutic Wishlist</h1>
        <p class="section-desc">Botanical remedies you've saved for later.</p>
      </div>

      <div class="products-grid" id="wishlistGrid">
        <!-- Wishlist items will be injected here by JS -->
      </div>
    </div>
  </main>

  <!-- Slide-out Cart Drawer (reused) -->
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-drawer-header">
      <h3>Your Bag</h3>
      <button class="btn-close-drawer" id="closeCartBtn" aria-label="Close cart">&times;</button>
    </div>

    <div class="cart-drawer-items" id="cartDrawerItems"></div>

    <div class="cart-drawer-footer">
      <div class="cart-subtotal-breakdown">
        <div class="cart-subtotal-row total-highlight">
          <span>Final Total:</span>
          <span id="cartDrawerSubtotal">₹0.00</span>
        </div>
      </div>
      <button class="btn btn-primary btn-checkout" onclick="openCheckoutModal()">
        Proceed to Checkout &rarr;
      </button>
    </div>
  </div>
  <div class="cart-backdrop" id="cartBackdrop"></div>
  
  <div class="modal" id="checkoutModal">
    <div class="modal-backdrop" id="checkoutBackdrop"></div>
    <div class="modal-dialog checkout-dialog">
      <button class="modal-close-btn" id="closeCheckoutBtn" aria-label="Close checkout">&times;</button>
      <div class="checkout-wrapper" id="checkoutContent"></div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <!-- Include the shared app script -->
  <script src="app.js?v=2"></script>
  
  <!-- Wishlist specific logic -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // app.js handles fetchProducts() automatically on DOMContentLoaded
      // Wait a moment for PRODUCTS to be populated by app.js (since it's async)
      await fetchProducts(); 
      renderWishlist();
    });

    function renderWishlist() {
      const container = document.getElementById('wishlistGrid');
      if (!container) return;

      const wishlistItems = PRODUCTS.filter(p => userWishlist.has(p.id));

      if (wishlistItems.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; background: #ffffff; border: 1px dashed var(--color-border); border-radius: var(--radius-md);">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="color: var(--color-text-muted); margin-bottom: 16px;">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <h3 style="font-family: var(--font-serif); font-size: 1.5rem; color: var(--color-text-main); margin-bottom: 10px;">Your wishlist is empty</h3>
            <p style="color: var(--color-text-muted); margin-bottom: 24px;">Discover our therapeutic formulations and save your favorites here.</p>
            <a href="index.html#products" class="btn btn-primary" style="text-decoration: none; display: inline-block;">Explore Remedies</a>
          </div>
        `;
        return;
      }

      container.innerHTML = wishlistItems.map(product => `
        <div class="product-card reveal-init is-revealed" data-id="${product.id}">
          <div class="product-media" onclick="window.location.href='index.html?quickview=${product.id}'" role="button" tabindex="0">
            ${product.badge ? `<span class="product-badge">${product.badge}</span>` : ''}
            <button class="product-wishlist-btn active" onclick="event.stopPropagation(); toggleWishlist('${product.id}', this)" aria-label="Remove from wishlist" title="Remove from wishlist">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
            </button>
            <img src="${product.image}" alt="${product.title}" loading="lazy" class="product-img" onerror="this.onerror=null; this.src='assets/anti_pigmentation.jpg';">
          </div>
          <div class="product-content">
            <div class="product-meta-row">
              <span class="product-category-text">${product.categoryLabel}</span>
              <span class="product-weight-text">${product.weight}</span>
            </div>
            <h3 class="product-title">
              <a href="index.html?quickview=${product.id}" style="color: inherit; text-decoration: none;">${product.title}</a>
            </h3>
            <div class="product-price-row">
              <div class="product-price">
                <span class="price-current">₹${product.price}</span>
                ${product.originalPrice ? `<span class="price-original">₹${product.originalPrice}</span>` : ''}
              </div>
            </div>
            <button class="btn btn-primary btn-block add-to-cart-btn" onclick="addToCart('${product.id}')">Add to Cart</button>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
